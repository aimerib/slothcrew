[build]
  command = "npm run build"
  publish = "_site"

[dev]
  command = "npm run dev"
  port = 8080
  publish = "_site"
  framework = "#custom"

# Photography moved to its own site
[[redirects]]
  from = "/noir"
  to = "https://aimeribaddouh.com"
  status = 301
  force = true

[[redirects]]
  from = "/noir/*"
  to = "https://aimeribaddouh.com"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404 

[[headers]]
  for = "*.wasm"
  [headers.values]
    Content-Type = "application/wasm"